[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ionmf"
version = "1.0.0"
description = "Biophysically inspired mean-field model of neuronal populations driven by ion exchange mechanisms"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "brian2>=2.5", "networkx>=3.0"]

[tool.setuptools]
packages = ["ionmf"]
